services:
  - type: web
    name: school-attendance-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: ADMIN_EMAIL
        sync: false
        value: getwellspent@gmail.com
      - key: SPRING_DATASOURCE_URL
        sync: false
        # Supabase PostgreSQL connection string format:
        # jdbc:postgresql://db.[YOUR-PROJECT-REF].supabase.co:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
        # Get free key from https://aistudio.google.com/
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
