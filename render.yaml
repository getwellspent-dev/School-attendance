services:
  - type: web
    name: school-attendance-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000

      - key: ADMIN_EMAIL
        value: getwellspent@gmail.com

      # ─── Supabase PostgreSQL ───────────────────────────────────────────────────
      # Use Supabase "Session mode" pooler URL (port 5432) OR direct URL (port 5432)
      # Format: jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?user=postgres.YOUR_REF&password=YOUR_PASSWORD&sslmode=require
      # Get it from: Supabase Dashboard → Project → Settings → Database → Connection String → JDBC
      - key: SPRING_DATASOURCE_URL
        sync: false

      - key: SPRING_DATASOURCE_USERNAME
        sync: false   # Set to: postgres.YOUR_PROJECT_REF (from Supabase pooler string)

      - key: SPRING_DATASOURCE_PASSWORD
        sync: false   # Your Supabase DB password

      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver

      - key: JPA_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect

      # ─── Auth ─────────────────────────────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false   # From Google Cloud Console → OAuth 2.0 Client ID

      - key: JWT_SECRET
        generateValue: true

      # ─── AI ───────────────────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false   # From https://aistudio.google.com/

      - key: GEMINI_MODEL
        value: gemini-1.5-flash

      # ─── CORS ─────────────────────────────────────────────────────────────────
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
