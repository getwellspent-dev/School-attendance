server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: attendance-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:attendancedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: ${JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  admin:
    email: ${ADMIN_EMAIL:getwellspent@gmail.com}
  jwt:
    secret: ${JWT_SECRET:VerySecureSecretKeyForSchoolAttendanceJwtAuthentication2026SuperKey9876543210}
    expiration-ms: 86400000 # 24 hours
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    url: https://generativelanguage.googleapis.com/v1beta/models

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,https://*.vercel.app}
